<header class="masthead">
  <nav class="masthead-inner" aria-label="Main">
    <a class="brand" href="{{ "" | relURL }}">{{ site.Params.short_name | upper }}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <ul id="nav-links" class="nav-links">
      {{- $current := . }}
      {{- range site.Menus.main }}
      {{- $url := .URL | relURL }}
      <li><a href="{{ $url }}" {{ if hasPrefix $current.RelPermalink $url }}aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
      <li><button class="search-btn" type="button" aria-label="Search (Ctrl+K)" title="Search (Ctrl+K)">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button></li>
    </ul>
  </nav>
</header>
