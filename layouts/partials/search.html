<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search this site" hidden>
  <div class="search-backdrop" data-close></div>
  <div class="search-panel">
    <div class="search-head">
      <span class="search-title">Search</span>
      <button type="button" class="search-close" data-close aria-label="Close search">&times;</button>
    </div>
    <div id="pagefind-search"></div>
    <p class="search-fallback" hidden>
      Search is not available right now.
      <a href="https://www.google.com/search?q=site%3A{{ site.BaseURL | replaceRE "^https?://" "" | replaceRE "/$" "" }}">Search this site with Google</a>.
    </p>
  </div>
</div>
<script>
(function () {
  var modal = document.getElementById('search-modal');
  var loaded = false;
  function load() {
    if (loaded) return; loaded = true;
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = '{{ "pagefind/pagefind-ui.css" | relURL }}';
    document.head.appendChild(css);
    var s = document.createElement('script');
    s.src = '{{ "pagefind/pagefind-ui.js" | relURL }}';
    s.onload = function () {
      new PagefindUI({ element: '#pagefind-search', showSubResults: true, showImages: false, autofocus: true });
      var input = modal.querySelector('input'); if (input) input.focus();
    };
    s.onerror = function () { modal.querySelector('.search-fallback').hidden = false; };
    document.head.appendChild(s);
  }
  function open() { modal.hidden = false; document.body.classList.add('no-scroll'); load(); var i = modal.querySelector('input'); if (i) i.focus(); }
  function close() { modal.hidden = true; document.body.classList.remove('no-scroll'); }
  document.querySelectorAll('.search-btn').forEach(function (b) { b.addEventListener('click', open); });
  modal.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', close); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); modal.hidden ? open() : close(); }
    else if (e.key === 'Escape' && !modal.hidden) close();
  });

  var toggle = document.querySelector('.nav-toggle');
  var links = document.getElementById('nav-links');
  toggle.addEventListener('click', function () {
    var openNow = links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', openNow ? 'true' : 'false');
  });
})();
</script>
