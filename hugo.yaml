baseURL: "https://althaber.github.io/"
title: "Agnieszka Althaber"
locale: en-us
enableRobotsTXT: true
disableKinds: [taxonomy, term]

outputs:
  home: [HTML, RSS]

markup:
  goldmark:
    renderer:
      unsafe: true

permalinks:
  publication: /publication/:contentbasename/

params:
  name: "Dr. Agnieszka Althaber"
  short_name: "Agnieszka Althaber"
  role: "Sociologist"
  position: "Postdoctoral Researcher"
  institution: "Ludwig-Maximilians-Universität Munich"
  institution_long: "Ludwig-Maximilians-Universität Munich"
  department: "Department of Sociology"
  location: "Munich, Germany"
  email: "a.althaber@lmu.de"
  photo: "images/profile.jpg"
  description: "Sociologist at Ludwig-Maximilians-Universität Munich working on wealth, gender and social inequalities, couples' money management, and the life course."

  # Profile links shown as icons on the homepage and the contact page.
  # Paste the URL between the quotes. Empty links are hidden on the
  # live site; while show_placeholder_links is true they appear greyed out.
  show_placeholder_links: true
  social:
    - { key: email,         label: "Email",          url: "mailto:a.althaber@lmu.de" }
    - { key: orcid,         label: "ORCID",          url: "https://orcid.org/0000-0002-3707-9475" }
    - { key: scholar,       label: "Google Scholar", url: "https://scholar.google.com/citations?user=pP33EJgAAAAJ" }
    - { key: osf,           label: "OSF",            url: "https://osf.io/a9564/" }
    - { key: linkedin,      label: "LinkedIn",       url: "https://www.linkedin.com/in/agnieszka-althaber-3063a2447" }
    - { key: bluesky,       label: "Bluesky",        url: "https://bsky.app/profile/aalthaber.bsky.social" }
    - { key: lmu,           label: "LMU profile",    url: "https://www.soziologie.lmu.de/de/das-institut/personen/kontaktseite/agnieszka-althaber-6b3f7c80.html" }

  # Settings chosen in the information form.
  mysite:
    credit: true
    discovery: true
    design:
      source: "reference site https://nkapelle.github.io/ (layout: top bar + sticky profile sidebar)"
      palette: "LMU green accent on white, slate text"

menu:
  main:
    - { name: "Publications", url: "/publication/", weight: 10 }
    - { name: "Talks",        url: "/talks/",       weight: 20 }
    - { name: "Teaching",     url: "/teaching/",    weight: 30 }
    - { name: "CV",           url: "/cv/",          weight: 40 }
    - { name: "Contact",      url: "/contact/",     weight: 50 }
